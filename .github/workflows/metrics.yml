name: Generate GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"    # Ejecuta a medianoche
  workflow_dispatch:       # Permite ejecución manual

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          persist-credentials: false  # Importante para usar tu token en el push

      - name: Generate Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: NicoButter
          template: classic
          config_timezone: America/Argentina/Buenos_Aires

      - name: Commit Metrics SVG
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add github-metrics.svg
          git commit -m "Update GitHub Metrics" || echo "No changes to commit"
          git push https://${{ secrets.METRICS_TOKEN }}@github.com/NicoButter/NicoButter.git HEAD:main