name: Generate GitHub Metrics

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/metrics.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-profile-metrics
  cancel-in-progress: false

jobs:
  metrics:
    name: Render profile metrics
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Render overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: NicoButter
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Argentina/Rio_Gallegos
          plugins_errors_fatal: yes
          output_action: none
          retries: 3
          retries_delay: 10
          verify: yes

      - name: Render language statistics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: NicoButter
          filename: github-languages.svg
          template: classic
          base: ""
          config_timezone: America/Argentina/Rio_Gallegos
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugins_errors_fatal: yes
          output_action: none
          retries: 3
          retries_delay: 10
          verify: yes

      - name: Render repository statistics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: NicoButter
          filename: github-repositories.svg
          template: classic
          base: repositories
          config_timezone: America/Argentina/Rio_Gallegos
          plugins_errors_fatal: yes
          output_action: none
          retries: 3
          retries_delay: 10
          verify: yes

      - name: Render recently used languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: NicoButter
          filename: github-recent-languages.svg
          template: terminal
          base: ""
          config_timezone: America/Argentina/Rio_Gallegos
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_sections: recently-used
          plugin_languages_details: percentage
          plugin_languages_limit: 6
          plugin_languages_recent_days: 30
          plugin_languages_recent_load: 500
          plugin_languages_analysis_timeout: 30
          plugins_errors_fatal: yes
          output_action: none
          retries: 3
          retries_delay: 10
          verify: yes

      - name: Render lines of code history
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: NicoButter
          filename: github-lines.svg
          template: terminal
          base: ""
          config_timezone: America/Argentina/Rio_Gallegos
          plugin_lines: yes
          plugin_lines_sections: repositories, history
          plugin_lines_repositories_limit: 4
          plugin_lines_history_limit: 3
          plugin_lines_delay: 30
          plugins_errors_fatal: yes
          output_action: none
          retries: 3
          retries_delay: 10
          verify: yes

      - name: Render recent GitHub activity
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: NicoButter
          filename: github-activity.svg
          template: classic
          base: activity
          config_timezone: America/Argentina/Rio_Gallegos
          plugins_errors_fatal: yes
          output_action: none
          retries: 3
          retries_delay: 10
          verify: yes

      - name: Render contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: NicoButter
          filename: github-calendar.svg
          template: classic
          base: ""
          config_timezone: America/Argentina/Rio_Gallegos
          config_display: large
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugins_errors_fatal: yes
          output_action: none
          retries: 3
          retries_delay: 10
          verify: yes

      - name: Publish generated SVGs
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Commit profile metrics
        shell: bash
        run: |
          sudo cp /metrics_renders/github-metrics.svg ./github-metrics.svg
          sudo cp /metrics_renders/github-languages.svg ./github-languages.svg
          sudo cp /metrics_renders/github-repositories.svg ./github-repositories.svg
          sudo cp /metrics_renders/github-recent-languages.svg ./github-recent-languages.svg
          sudo cp /metrics_renders/github-lines.svg ./github-lines.svg
          sudo cp /metrics_renders/github-activity.svg ./github-activity.svg
          sudo cp /metrics_renders/github-calendar.svg ./github-calendar.svg

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add github-metrics.svg github-languages.svg github-repositories.svg github-recent-languages.svg github-lines.svg github-activity.svg github-calendar.svg

          if git diff --cached --quiet; then
            echo "No metric changes to commit"
            exit 0
          fi

          git commit -m "chore: refresh GitHub profile metrics"
          git pull --rebase origin main
          git push origin HEAD:main
